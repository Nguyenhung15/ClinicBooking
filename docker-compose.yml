services:
  backend:
    build:
      context: ./backend
      target: development
    container_name: clinic_booking_backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/clinic_booking
      CORS_ORIGINS: http://localhost:${WEB_PORT:-5173}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy

  web:
    build:
      context: ./web
      target: development
    container_name: clinic_booking_web
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-3000}/api
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - backend

  mongodb:
    image: mongo:7.0
    container_name: clinic_booking_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
